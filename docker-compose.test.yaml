# Test-only Postgres and Redis for the Vitest `db` project and Playwright (the addresses in .env.test). Start and stop
# them with `pnpm test:db:up` / `pnpm test:db:down`.
# The development and production services are unrelated to them. Data lives only in memory and disappears when the
# containers stop.
# Keep Postgres on the same major version as Supabase. Change each image together with the CI service container
# (.github/workflows/ci.yml) and docker-compose.yaml.
# The project name is `name` from package.json plus -test (passed by pnpm), so it never mixes with the development
# Compose project.
name: ${npm_package_name:?run it through pnpm test:db:up / test:db:down}-test

services:
  db:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "app_test"]
      interval: 2s
      timeout: 5s
      retries: 20

  # Test-only Redis for the Vitest `db` project and Playwright (REDIS_URL in .env.test). No
  # persistence. Change the image together with the CI service container and docker-compose.yaml.
  redis:
    image: redis:8-alpine
    command:
      ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20
